[workspace]
members = ["carbonite-derive"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cbbowen/carbonite"
authors = ["Chris Bowen"]

[package]
name = "carbonite"
description = "Schema-separated columnar serialization built on serde"
readme = "README.md"
keywords = ["serde", "serialization", "columnar", "schema", "binary"]
categories = ["encoding", "data-structures", "compression"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["derive", "shared"]
# Re-exports `#[derive(Schema)]`, the compile-time schema fast path.
derive = ["dep:carbonite-derive"]
# The `Shared`/`SharedArc` wrappers, which write each unique Rc/Arc object
# once per row and rebuild pointer sharing on read. Write-side identity is the
# pointee's address, which carries a caveat for hand-written Serialize impls
# (see the type docs); the flag lets a build that doesn't need the wrappers
# opt out of the API and its caveat entirely. The wire format is unaffected:
# blobs containing shared columns still decode (repeats excepted) either way.
shared = []
# Compile-time schemas and columnar fast paths for `glam`'s math types, which
# the orphan rule puts out of reach for glam's own users. Turns on glam's
# `serde` and `all-types` features so every implemented type is present.
glam = ["dep:glam"]

[dependencies]
# Pinned exactly: the derive emits calls to carbonite's internal helpers (the
# `__`-prefixed items and the hidden `fallback` module), so the two must be
# upgraded together.
carbonite-derive = { version = "=1.0.0", path = "carbonite-derive", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# The implemented set is fixed at compile time, so the type families glam gates
# behind features have to be present: `all-types` is glam's own default, and
# `serde` is what the schemas here mirror.
glam = { version = "0.33", optional = true, default-features = false, features = [
    "std",
    "all-types",
    "serde",
] }

[dev-dependencies]
criterion = "0.8"
flate2 = "1"
postcard = { version = "1", features = ["alloc"] }
proptest = "1"
serde_json = "1"

[[bench]]
name = "compare"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
