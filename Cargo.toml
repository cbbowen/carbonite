[workspace]
members = ["carbonite-derive"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cbbowen/carbonite"
authors = ["Chris Bowen"]

[package]
name = "carbonite"
description = "Schema-separated columnar serialization built on serde"
readme = "README.md"
keywords = ["serde", "serialization", "columnar", "schema", "binary"]
categories = ["encoding", "data-structures", "compression"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["derive"]
# Re-exports `#[derive(Schema)]`, the compile-time schema fast path.
derive = ["dep:carbonite-derive"]

[dependencies]
# Pinned exactly: the derive emits calls to carbonite's `__`-prefixed internal
# helpers, so the two must be upgraded together.
carbonite-derive = { version = "=1.0.0", path = "carbonite-derive", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
criterion = "0.8"
flate2 = "1"
postcard = { version = "1", features = ["alloc"] }
proptest = "1"
serde_json = "1"

[[bench]]
name = "compare"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
